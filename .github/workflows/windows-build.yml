name: Windows build

on:
  push:
    branches:
      - codex/nexus-hid-async-fix
      - codex/chatgpt-focus-voice-pr
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build:
    runs-on: windows-latest
    timeout-minutes: 60

    steps:
      - name: Check out source
        uses: actions/checkout@v4
        with:
          lfs: true

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm

      - name: Select Rust 1.89
        shell: pwsh
        run: |
          rustup toolchain install 1.89.0 --profile minimal --no-self-update
          rustup default 1.89.0
          rustc -vV

      - name: Install JavaScript dependencies
        run: npm ci

      - name: Run JavaScript tests
        run: npm test

      - name: Run Rust tests
        run: cargo test --manifest-path src-tauri/Cargo.toml --workspace

      - name: Build frontend
        run: npm run build

      - name: Check Rust targets
        run: cargo check --manifest-path src-tauri/Cargo.toml --workspace --all-targets

      - name: Build NSIS installer
        run: npm run tauri:build

      - name: Verify installer output
        shell: pwsh
        run: |
          $installer = Get-ChildItem 'src-tauri/target/release/bundle/nsis/*.exe' |
            Select-Object -First 1
          if (-not $installer) {
            throw 'NSIS installer was not created'
          }
          $installer | Select-Object FullName, Length, LastWriteTime
          Get-FileHash -Algorithm SHA256 $installer.FullName

      - name: Upload NSIS installer
        uses: actions/upload-artifact@v4
        with:
          name: nexus-prime-windows-${{ github.sha }}
          path: src-tauri/target/release/bundle/nsis/*.exe
          if-no-files-found: error
          retention-days: 7
